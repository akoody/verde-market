services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://verdemarket.shop
    image: verde-market:production
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:5988:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: seed
      args:
        NEXT_PUBLIC_APP_URL: https://verdemarket.shop
    image: verde-market:seed
    env_file:
      - ${ENV_FILE:-.env.production}
    restart: "no"

volumes:
  product_uploads:
